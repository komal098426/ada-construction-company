<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-label="Illustration of construction framing against a dusk sky">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2b25"/>
      <stop offset="1" stop-color="#554e44"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#sky2)"/>
  <rect y="520" width="1600" height="180" fill="#332f29"/>
  <circle cx="1180" cy="140" r="40" fill="#e9e2d6" opacity=".8"/>
  <!-- timber frame structure -->
  <g stroke="#6b5b45" stroke-width="14">
    <line x1="420" y1="520" x2="420" y2="230"/>
    <line x1="700" y1="520" x2="700" y2="230"/>
    <line x1="980" y1="520" x2="980" y2="230"/>
    <line x1="420" y1="230" x2="980" y2="230"/>
    <line x1="420" y1="330" x2="980" y2="330"/>
    <line x1="420" y1="430" x2="980" y2="430"/>
  </g>
  <g stroke="#7d6a51" stroke-width="10">
    <line x1="490" y1="230" x2="490" y2="520"/>
    <line x1="560" y1="230" x2="560" y2="520"/>
    <line x1="630" y1="230" x2="630" y2="520"/>
    <line x1="770" y1="230" x2="770" y2="520"/>
    <line x1="840" y1="230" x2="840" y2="520"/>
    <line x1="910" y1="230" x2="910" y2="520"/>
    <line x1="420" y1="280" x2="980" y2="280"/>
    <line x1="420" y1="380" x2="980" y2="380"/>
    <line x1="420" y1="480" x2="980" y2="480"/>
    <line x1="420" y1="330" x2="700" y2="230"/>
    <line x1="700" y1="230" x2="980" y2="330"/>
    <line x1="420" y1="430" x2="700" y2="330"/>
    <line x1="700" y1="330" x2="980" y2="430"/>
  </g>
  <!-- scaffold -->
  <g stroke="#8a837a" stroke-width="7">
    <line x1="1080" y1="520" x2="1080" y2="260"/>
    <line x1="1180" y1="520" x2="1180" y2="260"/>
    <line x1="1080" y1="300" x2="1180" y2="300"/>
    <line x1="1080" y1="410" x2="1180" y2="410"/>
  </g>
  <!-- crane hint -->
  <g stroke="#a09888" stroke-width="9">
    <line x1="240" y1="520" x2="240" y2="120"/>
    <line x1="240" y1="140" x2="560" y2="140"/>
    <line x1="520" y1="140" x2="520" y2="200"/>
  </g>
  <rect x="506" y="200" width="28" height="34" fill="#b3572a"/>
</svg>
