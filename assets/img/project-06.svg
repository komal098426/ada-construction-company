<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustrated project card: pre-construction planning desk with site plans">
  <rect width="800" height="600" fill="#e7e1d4"/>
  <rect y="420" width="800" height="180" fill="#d4cdbd"/>
  <!-- wall -->
  <rect x="90" y="90" width="620" height="330" fill="#f0ebe0"/>
  <rect x="90" y="90" width="620" height="330" fill="none" stroke="#c5bda9" stroke-width="4"/>
  <!-- pinned site plan -->
  <g>
    <rect x="150" y="150" width="290" height="210" fill="#fff" stroke="#b7ae9a" stroke-width="3"/>
    <g stroke="#8a837a" stroke-width="3">
      <rect x="185" y="190" width="90" height="70" fill="none"/>
      <rect x="300" y="190" width="100" height="120" fill="none"/>
      <path d="M175 320 L400 320" fill="none"/>
      <path d="M260 340 L340 340" stroke-dasharray="8 6"/>
    </g>
    <circle cx="168" cy="158" r="7" fill="#b3572a"/>
    <circle cx="422" cy="352" r="7" fill="#b3572a"/>
  </g>
  <!-- desk edge with samples -->
  <rect y="420" width="800" height="26" fill="#9d8666"/>
  <g>
    <rect x="500" y="330" width="70" height="90" rx="4" fill="#f2b06a" opacity=".85" transform="rotate(-4 535 375)"/>
    <rect x="590" y="336" width="70" height="84" rx="4" fill="#57514a" transform="rotate(3 625 378)"/>
    <rect x="668" y="342" width="40" height="78" rx="4" fill="#cfc8b8" transform="rotate(-2 688 381)"/>
  </g>
  <!-- pencil -->
  <g transform="rotate(24 430 445)">
    <rect x="380" y="438" width="90" height="10" fill="#e8c66a"/>
    <path d="M470 438 l16 5 l-16 5 Z" fill="#3b362f"/>
    <rect x="372" y="436" width="12" height="14" fill="#b3572a"/>
  </g>
</svg>
